events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 80;
        server_name _;

        client_max_body_size 20M;

        # Анонимный эндпоинт для получения токена
        location /token {
            proxy_pass http://security:3000/v1/token;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Внутренний эндпоинт для проверки токена (используется auth_request)
        location /internal/auth {
            internal;
            proxy_pass http://security:3000/v1/token/validation;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        # Защищённый эндпоинт загрузки
        location /upload {
            auth_request /internal/auth;
            auth_request_set $auth_status $upstream_status;

            proxy_pass http://uploader:3000/v1/upload;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Защищённый эндпоинт для получения файлов
        location ~ ^/images/(.*)$ {
            auth_request /internal/auth;
            auth_request_set $auth_status $upstream_status;

            proxy_pass http://storage:9000/data/$1;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Обработка 401 (неавторизованно)
        error_page 401 = @unauthorized;
        location @unauthorized {
            return 401 '{"error":"Unauthorized"}';
            add_header Content-Type application/json;
        }
    }
}
