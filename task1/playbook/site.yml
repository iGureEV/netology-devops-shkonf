- name: Create Yandex Cloud infrastructure
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - infrastructure

  tasks:
    - name: Create VPC network
      ansible.builtin.shell:
        cmd: |
          yc vpc network create \
            --name my-network \
            --folder-id "{{ folder_id }}"
      register: network
      changed_when: network.rc == 0

    - name: Get network ID
      ansible.builtin.shell:
        cmd: |
          yc vpc network get \
            --name my-network \
            --folder-id "{{ folder_id }}" \
            --format json
      register: network_info
      changed_when: false

    - name: Set network_id fact
      ansible.builtin.set_fact:
        network_id: "{{ (network_info.stdout | from_json).id }}"

    - name: Create VPC subnet
      ansible.builtin.shell:
        cmd: |
          yc vpc subnet create \
            --name my-subnet \
            --folder-id "{{ folder_id }}" \
            --zone "{{ zone }}" \
            --network-id "{{ network_id }}" \
            --range 10.128.0.0/24
      register: subnet
      changed_when: subnet.rc == 0

    - name: Get subnet ID
      ansible.builtin.shell:
        cmd: |
          yc vpc subnet get \
            --name my-subnet \
            --folder-id "{{ folder_id }}" \
            --format json
      register: subnet_info
      changed_when: false

    - name: Set subnet_id fact
      ansible.builtin.set_fact:
        subnet_id: "{{ (subnet_info.stdout | from_json).id }}"

    - name: Create ClickHouse VM
      ycc_vm:
        auth:
          iam_token: "{{ iam_token }}"
        name: clickhouse
        folder_id: "{{ folder_id }}"
        zone_id: "{{ zone }}"
        platform_id: "Intel Cascade Lake"
        cores: 2
        memory: 4
        core_fraction: 20
        image_family: "{{ ubuntu_image_family }}"
        image_folder:
          - standard-images
        disk_size: 20
        disk_type: ssd
        subnet_id: "{{ subnet_id }}"
        assign_public_ip: true
        login: ubuntu
        public_ssh_key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"
        state: present

    - name: Create Vector VM
      ycc_vm:
        auth:
          iam_token: "{{ iam_token }}"
        name: vector
        folder_id: "{{ folder_id }}"
        zone_id: "{{ zone }}"
        platform_id: "Intel Cascade Lake"
        cores: 2
        memory: 4
        core_fraction: 20
        image_family: "{{ ubuntu_image_family }}"
        image_folder:
          - standard-images
        disk_size: 20
        disk_type: ssd
        subnet_id: "{{ subnet_id }}"
        assign_public_ip: true
        login: ubuntu
        public_ssh_key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"
        state: present

    - name: Create Lighthouse VM
      ycc_vm:
        auth:
          iam_token: "{{ iam_token }}"
        name: lighthouse
        folder_id: "{{ folder_id }}"
        zone_id: "{{ zone }}"
        platform_id: "Intel Cascade Lake"
        cores: 2
        memory: 4
        core_fraction: 20
        image_family: "{{ ubuntu_image_family }}"
        image_folder:
          - standard-images
        disk_size: 20
        disk_type: ssd
        subnet_id: "{{ subnet_id }}"
        assign_public_ip: true
        login: ubuntu
        public_ssh_key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"
        state: present

- name: Install Clickhouse
  hosts: clickhouse
  become: true
  roles:
    - clickhouse

- name: Install Vector
  hosts: vector
  become: true
  roles:
    - vector-role

- name: Install Lighthouse
  hosts: lighthouse
  become: true
  roles:
    - lighthouse-role
